<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thirst</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f14; color: #f5f5f7; text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .card { max-width: 22rem; padding: 2rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { opacity: .75; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        font: inherit; padding: .75rem 2rem; border: 0; border-radius: 999px;
        background: #6c5ce7; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Shown only if the live site cannot be reached (the app normally loads the remote URL). -->
    <div class="card">
      <h1>You're offline</h1>
      <p>Thirst needs an internet connection. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
